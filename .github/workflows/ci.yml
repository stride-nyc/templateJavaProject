
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    # Each matrix entry becomes its own job, and its own line
    # in the PR's checks list (e.g. "CI / Checkstyle").
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # let every check finish even if one fails
      matrix:
        include:
          - id: spotless
            name: Formatting (Spotless)
            tasks: spotlessCheck
          - id: tests
            name: Tests and coverage
            tasks: test jacocoTestCoverageVerification
          - id: checkstyle
            name: Checkstyle
            tasks: checkstyleMain checkstyleTest
          - id: pmd
            name: PMD
            tasks: pmdMain pmdTest
          - id: spotbugs
            name: SpotBugs
            tasks: spotbugsMain spotbugsTest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Run ${{ matrix.name }}
        run: ./gradlew ${{ matrix.tasks }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.id }}
          path: '**/build/reports/'
          retention-days: 7