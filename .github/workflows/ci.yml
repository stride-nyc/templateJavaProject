name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Each check is its own step so it shows its own pass/fail.
      # `!cancelled()` lets later steps run even if an earlier one failed.

      - name: Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Compile and test
        id: test
        if: ${{ !cancelled() }}
        run: ./gradlew test

      - name: Checkstyle
        if: ${{ !cancelled() }}
        run: ./gradlew checkstyleMain checkstyleTest

      - name: PMD
        if: ${{ !cancelled() }}
        run: ./gradlew pmdMain pmdTest

      - name: SpotBugs
        if: ${{ !cancelled() }}
        run: ./gradlew spotbugsMain spotbugsTest

      # Coverage is only meaningful if the tests passed.
      - name: Coverage (JaCoCo)
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: ./gradlew jacocoTestCoverageVerification

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
